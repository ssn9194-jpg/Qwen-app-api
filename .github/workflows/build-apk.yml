name: Build Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK Manager
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$(find "$ANDROID_HOME" \
            -type f \
            -path "*/cmdline-tools/*/bin/sdkmanager" \
            2>/dev/null | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found"
            find "$ANDROID_HOME" -maxdepth 4 -type f | head -200
            exit 1
          fi

          echo "Found sdkmanager: $SDKMANAGER"

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Show SDK Manager version
        shell: bash
        run: |
          "$SDKMANAGER" --version

      - name: Accept Android licenses
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;35.0.0"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Show versions
        shell: bash
        run: |
          java -version
          gradle --version
          "$SDKMANAGER" --version

      - name: Build Debug APK
        shell: bash
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        if: success()
        shell: bash
        run: |
          echo "Generated APK:"
          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AIStudioSuperApp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AIStudioSuperApp-build-reports
          path: |
            app/build/reports/**
            build/reports/**
          if-no-files-found: ignore
          retention-days: 7
