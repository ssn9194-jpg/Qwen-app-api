name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 37
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-37"

      # This deliberately installs Gradle directly. The uploaded project was
      # missing gradle/wrapper/gradle-wrapper.jar, so GitHub Actions must not
      # depend on ./gradlew being usable before the build starts.
      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Show tool versions
        run: |
          java -version
          gradle --version
          sdkmanager --version

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace --warning-mode all

      - name: Upload debug APK
        if: always() && hashFiles('app/build/outputs/apk/debug/*.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: AIStudioSuperApp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AIStudioSuperApp-build-reports
          path: |
            app/build/reports/**
            build/reports/**
          if-no-files-found: ignore
          retention-days: 7
